server:
  host: 0.0.0.0
  port: 8080
  mode: debug

database:
  host: localhost
  port: 3306
  name: hls_streamer
  user: root
  password: ""
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: localhost:6379
  password: ""
  db: 0

s3:
  endpoint: ""
  region: us-east-1
  bucket: hls-videos
  access_key: ""
  secret_key: ""
  use_path_style: false

jwt:
  secret: "change-me-in-production"
  access_ttl: 15m
  refresh_ttl: 168h  # 7 days

ffmpeg:
  path: ffmpeg
  ffprobe_path: ffprobe
  threads: 0

shaka:
  path: packager

drm:
  fairplay_cert_path: ""
  fairplay_key_path: ""

worker:
  id: ""
  concurrency: 2
  temp_dir: /tmp/hls-worker
  heartbeat_interval: 10s

thumbnails:
  default_count: 5
  default_width: 320
  default_height: 180

hls:
  segment_duration: 6
  segment_extension: ".jpeg"
