services:
  mysql:
    image: mysql:8.0
    container_name: hls-mysql
    environment:
      MYSQL_ROOT_PASSWORD: BarTn0qluW17Rs5K
      MYSQL_DATABASE: hls_streamer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hls-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: hls-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/hls-videos --ignore-existing;
      mc anonymous set download local/hls-videos;
      echo 'Bucket ready';
      "

  api:
    build:
      context: .
      target: api
    container_name: hls-api
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/etc/hls-streamer:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    container_name: hls-worker
    volumes:
      - ./configs:/etc/hls-streamer:ro
      - worker_tmp:/tmp/hls-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_data:
  minio_data:
  worker_tmp:
